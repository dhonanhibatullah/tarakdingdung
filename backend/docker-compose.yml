name: tarakdingdung

# The database is external and not managed here. Connection settings come from
# .env, so pointing at a different instance is an .env change rather than a
# compose change.

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    # The container always binds 0.0.0.0:8080 internally, whatever .env says.
    # TRDD_BE_HTTP_PORT in .env selects only the *host-published* port (the
    # left side of the mapping below); overriding it here keeps uvicorn, the
    # port mapping and the healthcheck agreed on 8080 inside the container.
    TRDD_BE_HTTP_HOST: 0.0.0.0
    TRDD_BE_HTTP_PORT: "8080"
  extra_hosts:
    # Lets TRDD_BE_POSTGRES_HOST=host.docker.internal reach a database running
    # on the host itself. A LAN address needs nothing extra; 127.0.0.1 would
    # otherwise resolve to the container.
    - "host.docker.internal:host-gateway"

services:
  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRDD_BE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-shot: `docker compose run --rm seeder`. Shares the backend image, so it
  # cannot seed with different code than the app is running.
  seeder:
    <<: *backend
    command: ["seed"]
    restart: "no"
    profiles: ["tools"]
