name: tarakdingdung

# The database is external and not managed here. Connection settings come from
# .env, so pointing at a different instance is an .env change rather than a
# compose change.

x-backend: &backend
  # One explicit image name shared by every service. Without it compose builds
  # a separate image per service from the identical build config, so rebuilding
  # one (`docker compose build backend`) leaves the others on stale code — a
  # schema/code skew between the app and the seeder waiting to happen.
  image: tarakdingdung-backend:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    # Bind on all interfaces inside the container, not on whatever the host
    # uses. TRDD_BE_HTTP_PORT (from .env) is the single knob for the port:
    # uvicorn binds it, and the mapping + healthcheck below both interpolate
    # the same value, so container and host port always match.
    TRDD_BE_HTTP_HOST: 0.0.0.0
  extra_hosts:
    # Lets TRDD_BE_POSTGRES_HOST=host.docker.internal reach a database running
    # on the host itself. A LAN address needs nothing extra; 127.0.0.1 would
    # otherwise resolve to the container.
    - "host.docker.internal:host-gateway"

services:
  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      # TRDD_BE_BIND_HOST is the interface the port is published on. Default
      # 127.0.0.1 keeps the API reachable only from this host. Set it to a LAN
      # or tailnet address (e.g. 192.168.18.18) — or 0.0.0.0 for any interface
      # — in .env when another machine or a separate container stack (the
      # frontend) needs to reach it. The API requires JWT auth, but the login
      # endpoint is then exposed, and cron trading runs against real keys.
      - "${TRDD_BE_BIND_HOST:-127.0.0.1}:${TRDD_BE_HTTP_PORT:-8080}:${TRDD_BE_HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${TRDD_BE_HTTP_PORT:-8080}/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-shot: `docker compose run --rm seeder`. Shares the backend image, so it
  # cannot seed with different code than the app is running.
  seeder:
    <<: *backend
    command: ["seed"]
    restart: "no"
    profiles: ["tools"]
